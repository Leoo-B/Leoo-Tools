<!DOCTYPE html>

        })();
    </script>

    <div class="splash-sub">By Galang</div>
    <div class="nx-bar-wrap">
        <div class="nx-bar-track">
            <div class="nx-bar-fill"></div>
        </div>
    </div>
    <div class="nx-status" id="nexusShellStatus">menginisialisasi sistem</div>
</div>

<!-- FIXED HEADER -->
<div class="navbar-wrapper" id="navbarWrapper">
    <div class="navbar" id="navbarFull">
        <div class="brand">Leoo Tools <small>V 1.0</small></div>
        <div class="nav-search">
            <i data-lucide="search"></i>
            <input type="text" id="searchInput" placeholder="Cari tools...">
        </div>
        <div style="display:flex; gap:10px; align-items:center;">

    </div>
    <div class="navbar-collapsed" id="navbarCollapsed">

    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
    <div class="categories" id="categoryFilter">
        <span class="chip active" data-cat="all">Semua</span>

        <div class="tool-page-header">
            <button class="btn-back" onclick="closeToolPage()">
                <i data-lucide="arrow-left"></i>
                Kembali

        <div class="tool-page-body" id="toolPageBody"></div>
    </div>
</div>

<!-- FIXED FOOTER -->
<div class="footer-credit">Leoo Tools Pro · Dihidupkan oleh <span>Galang</span></div>

<script src="splash.js"></script>
<script src="loader.js"></script>

<!-- SPACE CANVAS SCRIPT (orbit rings + meteor) -->
<script>
(function () {
    var canvas = document.getElementById('spaceCanvas');
    var ctx    = canvas.getContext('2d');

    function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize, { passive: true });

    // ── ORBIT RINGS ──────────────────────────────────────────────
    var rings = [
        { cx: 0.72, cy: 0.18, rx: 220, ry: 80,  angle: 0,    speed: 0.00018, color: 'rgba(96,165,250,0.07)',  width: 1.2 },
        { cx: 0.20, cy: 0.65, rx: 170, ry: 65,  angle: 1.2,  speed: 0.00012, color: 'rgba(129,140,248,0.06)', width: 1.0 },
        { cx: 0.85, cy: 0.75, rx: 130, ry: 50,  angle: 2.5,  speed: 0.00022, color: 'rgba(34,211,238,0.05)',  width: 0.8 },
        { cx: 0.40, cy: 0.30, rx: 260, ry: 95,  angle: 0.7,  speed: 0.00010, color: 'rgba(96,165,250,0.04)',  width: 1.5 },
        { cx: 0.60, cy: 0.88, rx: 190, ry: 70,  angle: 3.8,  speed: 0.00015, color: 'rgba(244,114,182,0.04)', width: 0.9 },
    ];

    // Dot travelling along each ring
    var dots = rings.map(function (r) {
        return { angle: Math.random() * Math.PI * 2, speed: r.speed * 18 };
    });

    // ── METEORS ───────────────────────────────────────────────────
    var meteors = [];
    var METEOR_INTERVAL_MIN = 2800;
    var METEOR_INTERVAL_MAX = 6000;
    var nextMeteorIn = METEOR_INTERVAL_MIN;
    var lastMeteorTime = 0;

    function spawnMeteor(now) {
        var startX = Math.random() * canvas.width * 0.8;
        var startY = Math.random() * canvas.height * 0.3;
        var len    = 80 + Math.random() * 120;
        var speed  = 2.2 + Math.random() * 2.0;
        meteors.push({
            x: startX, y: startY,
            dx: speed * 1.6,
            dy: speed * 0.9,
            len: len,
            life: 1.0,          // opacity multiplier
            decay: 0.022 + Math.random() * 0.014,
        });
        lastMeteorTime  = now;
        nextMeteorIn    = METEOR_INTERVAL_MIN + Math.random() * (METEOR_INTERVAL_MAX - METEOR_INTERVAL_MIN);
    }

    // ── DRAW LOOP ─────────────────────────────────────────────────
    var raf;
    function draw(now) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        var W = canvas.width;
        var H = canvas.height;

        // Draw rings
        rings.forEach(function (r, i) {
            r.angle += r.speed;

            ctx.save();
            ctx.translate(r.cx * W, r.cy * H);
            ctx.rotate(r.angle);

            // Ellipse ring
            ctx.beginPath();
            ctx.ellipse(0, 0, r.rx, r.ry, 0, 0, Math.PI * 2);
            ctx.strokeStyle = r.color;
            ctx.lineWidth   = r.width;
            ctx.stroke();

            // Travelling dot
            var d = dots[i];
            d.angle += d.speed;
            var dx = Math.cos(d.angle) * r.rx;
            var dy = Math.sin(d.angle) * r.ry;

            // Dot glow
            var grad = ctx.createRadialGradient(dx, dy, 0, dx, dy, 5);
            grad.addColorStop(0, r.color.replace(/[\d.]+\)$/, '0.9)'));
            grad.addColorStop(1, r.color.replace(/[\d.]+\)$/, '0)'));
            ctx.beginPath();
            ctx.arc(dx, dy, 4, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.restore();
        });

        // Spawn meteor on schedule
        if (now - lastMeteorTime > nextMeteorIn) {
            spawnMeteor(now);
        }

        // Draw meteors
        meteors = meteors.filter(function (m) { return m.life > 0; });
        meteors.forEach(function (m) {
            var tailX = m.x - m.dx * (m.len / (m.speed || 4));
            var tailY = m.y - m.dy * (m.len / (m.speed || 4));

            var grad = ctx.createLinearGradient(tailX, tailY, m.x, m.y);
            grad.addColorStop(0, 'rgba(255,255,255,0)');
            grad.addColorStop(0.6, 'rgba(180,220,255,' + (m.life * 0.35) + ')');
            grad.addColorStop(1,   'rgba(255,255,255,' + (m.life * 0.85) + ')');

            ctx.beginPath();
            ctx.moveTo(tailX, tailY);
            ctx.lineTo(m.x, m.y);
            ctx.strokeStyle = grad;
            ctx.lineWidth   = 1.5;
            ctx.lineCap     = 'round';
            ctx.stroke();

            // Head sparkle
            ctx.beginPath();
            ctx.arc(m.x, m.y, 1.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,' + (m.life * 0.9) + ')';
            ctx.fill();

            m.x    += m.dx;
            m.y    += m.dy;
            m.life -= m.decay;
        });

        raf = requestAnimationFrame(draw);
    }

    raf = requestAnimationFrame(draw);

    // Pause when tab hidden to save resources
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            cancelAnimationFrame(raf);
        } else {
            raf = requestAnimationFrame(draw);
        }
    });
})();
</script>

</body>
</html>
