<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060912" />
    <title>Leoo Tools Pro</title>
    <link rel="icon" type="image/jpeg" href="wmremove-transformed.jpeg" />
    <script>
        (function () {
            var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var saveData = navigator.connection && navigator.connection.saveData;
            var cores = navigator.hardwareConcurrency || 2;
            var mem = navigator.deviceMemory || 2;
            var mode;
            if (prefersReduced || saveData) mode = 'entry';
            else if (cores <= 2 || mem <= 2) mode = 'entry';
            else if (cores <= 4 || mem <= 4) mode = 'mid';
            else mode = 'high';
            document.documentElement.setAttribute('data-performance', mode);
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Scroll-to-top button -->
<button class="scroll-top" id="scrollTopBtn" title="Ke Atas">
    <i data-lucide="arrow-up"></i>
</button>

<!-- Confirm modal -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-card">
        <div class="confirm-icon"><i data-lucide="alert-triangle"></i></div>
        <h3 class="confirm-title">Proses Masih Berjalan</h3>
        <p class="confirm-desc">Ada proses yang sedang berjalan. Jika keluar sekarang, proses akan dibatalkan.</p>
        <div class="confirm-actions">
            <button class="confirm-btn confirm-btn--stay" id="confirmStay">Tetap di Sini</button>
            <button class="confirm-btn confirm-btn--leave" id="confirmLeave">Keluar &amp; Batalkan</button>
        </div>
    </div>
</div>

<!-- Fixed header -->
<div class="navbar-wrapper" id="navbarWrapper">
    <div class="navbar" id="navbarFull">
        <div class="brand">Leoo Tools <small>V 1.0</small></div>
        <div class="nav-search">
            <i data-lucide="search"></i>
            <input type="text" id="searchInput" placeholder="Cari tools..." autocomplete="off" />
        </div>
        <button class="theme-toggle" id="themeToggle" title="Toggle tema">
            <i data-lucide="sun" id="themeIcon"></i>
        </button>
    </div>
    <div class="navbar-collapsed" id="navbarCollapsed">
        <div class="nav-search">
            <i data-lucide="search"></i>
            <input type="text" id="searchInputCollapsed" placeholder="Cari tools..." autocomplete="off" />
        </div>
    </div>
</div>

<!-- Hero section -->
<section class="hero">
    <div class="hero-content">
        <h1 id="hero-title">Leoo Tools Pro</h1>
        <p class="hero-tagline">Free, no-login web toolbox</p>
        <div class="hero-search">
            <i data-lucide="search"></i>
            <input type="text" id="heroSearchInput" placeholder="Cari tools..." autocomplete="off" />
        </div>
    </div>
    <div class="hero-glow" aria-hidden="true"></div>
</section>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
    <div class="categories" id="categoryFilter">
        <span class="chip active" data-cat="all">Semua</span>
        <span class="chip" data-cat="utility">Utility</span>
        <span class="chip" data-cat="dev">Dev</span>
        <span class="chip" data-cat="text">Text</span>
    </div>
    <div class="tools-grid" id="toolsGrid"></div>
    <div class="tool-page" id="toolPage" style="display:none;">
        <div class="tool-page-header">
            <button class="btn-back" onclick="closeToolPage()">
                <i data-lucide="arrow-left"></i> Kembali
            </button>
            <h2 id="toolPageTitle">Tool</h2>
        </div>
        <div class="tool-page-body" id="toolPageBody"></div>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    <p>Leoo Tools · Dihidupkan oleh <span class="heart">&#9829;</span> Galang</p>
    <nav class="footer-links">
        <a href="#" rel="noopener">GitHub</a>
        <span class="divider">|</span>
        <a href="#" rel="noopener">Issues</a>
        <span class="divider">|</span>
        <a href="#" rel="noopener">License</a>
    </nav>
</div>

<script src="splash.js"></script>
<script src="loader.js"></script>

<!-- Space canvas script -->
<script>
(function () {
    var perf = document.documentElement.getAttribute('data-performance') || 'high';
    var CFG = {
        entry: {ringCount:2, meteors:false, fps:20},
        mid:   {ringCount:3, meteors:true,  fps:30, meteorMin:5000, meteorMax:10000},
        high:  {ringCount:5, meteors:true,  fps:60, meteorMin:2800, meteorMax:6000}
    };
    var cfg = CFG[perf] || CFG.high;
    var canvas = document.getElementById('spaceCanvas');
    var ctx = canvas.getContext('2d');
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
    resize();
    addEventListener('resize', resize);
    var rings = [
        {cx:.72,cy:.18,rx:220,ry:80,ang:0,speed:.00018,color:'rgba(99,102,241,0.07)',w:1.2},
        {cx:.20,cy:.65,rx:170,ry:65,ang:1.2,speed:.00012,color:'rgba(165,139,252,0.06)',w:1.0},
        {cx:.85,cy:.75,rx:130,ry:50,ang:2.5,speed:.00022,color:'rgba(99,102,241,0.05)',w:.8},
        {cx:.40,cy:.30,rx:260,ry:95,ang:.7,speed:.00010,color:'rgba(99,102,241,0.04)',w:1.5},
        {cx:.60,cy:.88,rx:190,ry:70,ang:3.8,speed:.00015,color:'rgba(248,113,113,0.04)',w:.9}
    ].slice(0,cfg.ringCount);
    var dots = rings.map(r=>({ang:Math.random()*Math.PI*2,speed:r.speed*18}));
    var meteors=[];var nextMeteor=cfg.meteors?cfg.meteorMin:Infinity;var lastMeteor=0;
    function spawn(now){
        var sx=Math.random()*canvas.width*0.8, sy=Math.random()*canvas.height*0.3;
        var len=80+Math.random()*120, sp=2.2+Math.random()*2;
        meteors.push({x:sx,y:sy,dx:sp*1.6,dy:sp*0.9,len,life:1,decay:.022+Math.random()*.014});
        lastMeteor=now;nextMeteor=cfg.meteorMin+Math.random()*(cfg.meteorMax-cfg.meteorMin);
    }
    var raf,prev=0;function draw(t){
        raf=requestAnimationFrame(draw);
        if(t-prev<1000/cfg.fps) return;prev=t;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        rings.forEach((r,i)=>{
            r.ang+=r.speed;
            ctx.save();
            ctx.translate(r.cx*canvas.width, r.cy*canvas.height);
            ctx.rotate(r.ang);
            ctx.beginPath();ctx.ellipse(0,0,r.rx,r.ry,0,0,Math.PI*2);
            ctx.strokeStyle=r.color;ctx.lineWidth=r.w;ctx.stroke();
            var d=dots[i];d.ang+=d.speed;var dx=Math.cos(d.ang)*r.rx, dy=Math.sin(d.ang)*r.ry;
            var grad=ctx.createRadialGradient(dx,dy,0,dx,dy,5);
            grad.addColorStop(0,r.color.replace(/\d+\)$/, '0.9)'));
            grad.addColorStop(1,r.color.replace(/\d+\)$/, '0)'));
            ctx.beginPath();ctx.arc(dx,dy,4,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
            ctx.restore();
        });
        if(cfg.meteors){
            if(t-lastMeteor>nextMeteor) spawn(t);
            meteors=meteors.filter(m=>m.life>0);
            meteors.forEach(m=>{
                var tx=m.x-m.dx*(m.len/(m.dx||4)), ty=m.y-m.dy*(m.len/(m.dy||4));
                var grad=ctx.createLinearGradient(tx,ty,m.x,m.y);
                grad.addColorStop(0,'rgba(255,255,255,0)');
                grad.addColorStop(.6,'rgba(180,220,255,'+(m.life*.35)+')');
                grad.addColorStop(1,'rgba(255,255,255,'+(m.life*.85)+')');
                ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(m.x,m.y);
                ctx.strokeStyle=grad;ctx.lineWidth=1.5;ctx.lineCap='round';ctx.stroke();
                ctx.beginPath();ctx.arc(m.x,m.y,1.5,0,Math.PI*2);
                ctx.fillStyle='rgba(255,255,255,'+(m.life*.9)+')';ctx.fill();
                m.x+=m.dx; m.y+=m.dy; m.life-=m.decay;
            });
        }
    };
    raf=requestAnimationFrame(draw);
    addEventListener('visibilitychange',()=>{if(document.hidden) cancelAnimationFrame(raf); else{prev=0;raf=requestAnimationFrame(draw);} });
})();
</script>
</body>
</html>
