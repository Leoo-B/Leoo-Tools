<!DOCTYPE html>

    <meta charset="UTF-8">

    <meta name="theme-color" content="#070b18">
    <title>Leoo Tools Pro</title>
    <link rel="icon" type="image/jpeg" href="wmremove-transformed.jpeg">
    <script>
        (function () {
            // Set performance mode early so CSS and scripts can adapt.
            var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var saveData = navigator.connection && navigator.connection.saveData;
            var cores = navigator.hardwareConcurrency || 2;
            var mem = navigator.deviceMemory || 2;

            var mode;
            if (prefersReduced || saveData) {
                mode = 'entry';
            } else if (cores <= 2 || mem <= 2) {
                mode = 'entry';
            } else if (cores <= 4 || mem <= 4) {
                mode = 'mid';
            } else {
                mode = 'high';
            }

            document.documentElement.setAttribute('data-performance', mode);

            // Preserve existing theme behavior
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<!-- SPACE CANVAS — Adaptive performance -->
<script>
(function () {
    // Use data-performance attribute if present, else fallback to hardware detection
    var perfAttr = document.documentElement.getAttribute('data-performance');
    var mode;
    if (perfAttr) {
        mode = perfAttr; // 'entry' | 'mid' | 'high'
    } else {
        var cores  = navigator.hardwareConcurrency  || 2;
        var mem    = navigator.deviceMemory         || 2; // GB, undefined di Firefox
        if (cores <= 2 || mem <= 2) mode = 'entry';
        else if (cores <= 4 || mem <= 4) mode = 'mid';
        else mode = 'high';
    }

    // Map to configuration
    var CFG = {
        entry: { ringCount: 2, meteors: false, fps: 20 },
        mid:   { ringCount: 3, meteors: true,  fps: 30, meteorIntervalMin: 5000, meteorIntervalMax: 10000 },
        high:  { ringCount: 5, meteors: true,  fps: 60, meteorIntervalMin: 2800, meteorIntervalMax: 6000  },
    };
    var cfg = CFG[mode] || CFG.high;
    var frameDuration = 1000 / cfg.fps;

    var canvas = document.getElementById('spaceCanvas');
    var ctx    = canvas.getContext('2d');

    function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize, { passive: true });

    var allRings = [
        { cx: 0.72, cy: 0.18, rx: 220, ry: 80,  angle: 0,    speed: 0.00018, color: 'rgba(96,165,250,0.07)',  width: 1.2 },
        { cx: 0.20, cy: 0.65, rx: 170, ry: 65,  angle: 1.2,  speed: 0.00012, color: 'rgba(129,140,248,0.06)', width: 1.0 },
        { cx: 0.85, cy: 0.75, rx: 130, ry: 50,  angle: 2.5,  speed: 0.00022, color: 'rgba(34,211,238,0.05)',  width: 0.8 },
        { cx: 0.40, cy: 0.30, rx: 260, ry: 95,  angle: 0.7,  speed: 0.00010, color: 'rgba(96,165,250,0.04)',  width: 1.5 },
        { cx: 0.60, cy: 0.88, rx: 190, ry: 70,  angle: 3.8,  speed: 0.00015, color: 'rgba(244,114,182,0.04)', width: 0.9 },
    ];
    var rings = allRings.slice(0, cfg.ringCount);
    var dots  = rings.map(function (r) {
        return { angle: Math.random() * Math.PI * 2, speed: r.speed * 18 };
    });

    var meteors = [];
    var nextMeteorIn = cfg.meteors ? cfg.meteorIntervalMin : Infinity;
    var lastMeteorTime = 0;

    function spawnMeteor(now) {
        var startX = Math.random() * canvas.width * 0.8;
        var startY = Math.random() * canvas.height * 0.3;
        var len    = 80 + Math.random() * 120;
        var speed  = 2.2 + Math.random() * 2.0;
        meteors.push({
            x: startX, y: startY,
            dx: speed * 1.6,
            dy: speed * 0.9,
            len: len,
            life: 1.0,
            decay: 0.022 + Math.random() * 0.014,
        });
        lastMeteorTime = now;
        nextMeteorIn   = cfg.meteorIntervalMin +
            Math.random() * (cfg.meteorIntervalMax - cfg.meteorIntervalMin);
    }

    var raf;
    var lastFrameTime = 0;

    function draw(now) {
        raf = requestAnimationFrame(draw);
        if (now - lastFrameTime < frameDuration) return;
        lastFrameTime = now;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        var W = canvas.width;
        var H = canvas.height;

        rings.forEach(function (r, i) {
            r.angle += r.speed;

            ctx.save();
            ctx.translate(r.cx * W, r.cy * H);
            ctx.rotate(r.angle);

            ctx.beginPath();
            ctx.ellipse(0, 0, r.rx, r.ry, 0, 0, Math.PI * 2);
            ctx.strokeStyle = r.color;
            ctx.lineWidth   = r.width;
            ctx.stroke();

            var d = dots[i];
            d.angle += d.speed;
            var dx = Math.cos(d.angle) * r.rx;
            var dy = Math.sin(d.angle) * r.ry;

            var grad = ctx.createRadialGradient(dx, dy, 0, dx, dy, 5);
            grad.addColorStop(0, r.color.replace(/[\d.]+\)$/, '0.9)'));
            grad.addColorStop(1, r.color.replace(/[\d.]+\)$/, '0)'));
            ctx.beginPath();
            ctx.arc(dx, dy, 4, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.restore();
        });

        if (cfg.meteors) {
            if (now - lastMeteorTime > nextMeteorIn) spawnMeteor(now);

            meteors = meteors.filter(function (m) { return m.life > 0; });
            meteors.forEach(function (m) {
                var tailX = m.x - m.dx * (m.len / (m.dx || 4));
                var tailY = m.y - m.dy * (m.len / (m.dy || 4));

                var grad = ctx.createLinearGradient(tailX, tailY, m.x, m.y);
                grad.addColorStop(0, 'rgba(255,255,255,0)');
                grad.addColorStop(0.6, 'rgba(180,220,255,' + (m.life * 0.35) + ')');
                grad.addColorStop(1,   'rgba(255,255,255,' + (m.life * 0.85) + ')');

                ctx.beginPath();
                ctx.moveTo(tailX, tailY);
                ctx.lineTo(m.x, m.y);
                ctx.strokeStyle = grad;
                ctx.lineWidth   = 1.5;
                ctx.lineCap     = 'round';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(m.x, m.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,' + (m.life * 0.9) + ')';
                ctx.fill();

                m.x    += m.dx;
                m.y    += m.dy;
                m.life -= m.decay;
            });
        }
    }

    raf = requestAnimationFrame(draw);

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            cancelAnimationFrame(raf);
        } else {
            lastFrameTime = 0;
            raf = requestAnimationFrame(draw);
        }
    });
})();
</script>

</body>
</html>
