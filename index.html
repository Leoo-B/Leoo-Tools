<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Leoo Tools Pro</title>
    <script>
        // Set tema SEBELUM render pertama, biar gak ada flash light->dark saat refresh.
        (function() {
            var theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<!-- SCROLL TOP -->
<button class="scroll-top" id="scrollTopBtn" title="Ke Atas">
    <i data-lucide="arrow-up"></i>
</button>

<!-- SPLASH SCREEN -->
<div class="splash-screen" id="splash">
    <div class="splash-mesh"></div>
    <div class="splash-title">Leoo Tools</div>
    <div class="splash-sub">By Galang</div>
    <div class="nx-bar-wrap"><div class="nx-bar-track"><div class="nx-bar-fill"></div></div></div>
    <div class="nx-status" id="nexusShellStatus">menyiapkan tools</div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
    <!-- Navbar -->
    <div class="navbar">
        <div class="brand">Leoo Tools <small>V 1.0</small></div>
        <div class="nav-search" id="navSearch">
            <i data-lucide="search"></i>
            <input type="text" id="searchInput" placeholder="Cari tools...">
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
            <button class="theme-toggle" id="themeToggle" title="Toggle tema">
                <i data-lucide="moon" id="themeIcon"></i>
            </button>
        </div>
    </div>

    <!-- Kategori -->
    <div class="categories" id="categoryFilter">
        <span class="chip active" data-cat="all">Semua</span>
        <span class="chip" data-cat="utility">Utility</span>
        <span class="chip" data-cat="dev">Dev</span>
        <span class="chip" data-cat="text">Text</span>
    </div>

    <!-- Grid Tools -->
    <div class="tools-grid" id="toolsGrid"></div>

    <!-- Halaman Tool (Full Page) -->
    <!-- FIX: hapus style="display:none;" agar tidak konflik dengan CSS class .tool-page.active -->
    <div class="tool-page" id="toolPage">
        <div class="tool-page-header">
            <button class="btn-back" onclick="closeToolPage()">
                <i data-lucide="arrow-left"></i>
                Kembali
            </button>
            <h2 id="toolPageTitle">Tool</h2>
        </div>
        <div class="tool-page-body" id="toolPageBody"></div>
    </div>

    <div class="footer-credit">Leoo Tools Pro · Dihidupkan oleh <span>GeminiXD</span></div>
</div>

<!-- ========================================================= -->
<!-- SCRIPT LOADER UNTUK SEMUA TOOLS                           -->
<!-- ========================================================= -->
<script src="splash.js"></script>
<script src="loader.js"></script>
</body>
</html>
