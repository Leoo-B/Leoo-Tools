<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b18">
    <link rel="icon" type="image/jpeg" href="wmremove-transformed.jpeg">
    <title>Leoo Tools Pro</title>
    <script>
        (function () {
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<!-- SCROLL TOP -->
<button class="scroll-top" id="scrollTopBtn" title="Ke Atas">
    <i data-lucide="arrow-up"></i>
</button>

<!-- SPLASH SCREEN -->
<div class="splash-screen" id="splash">
    <div class="splash-mesh"></div>
    <div class="splash-title">Leoo Tools</div>
    <div class="splash-sub">By Galang</div>
    <div class="nx-bar-wrap">
        <div class="nx-bar-track">
            <div class="nx-bar-fill"></div>
        </div>
    </div>
    <div class="nx-status" id="nexusShellStatus">menginisialisasi sistem</div>
</div>

<!-- FIXED HEADER -->
<div class="navbar-wrapper" id="navbarWrapper">
    <div class="navbar" id="navbarFull">
        <div class="brand">Leoo Tools <small>V 1.0</small></div>
        <div class="nav-search">
            <i data-lucide="search"></i>
            <input type="text" id="searchInput" placeholder="Cari tools...">
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <button class="theme-toggle" id="themeToggle" title="Toggle tema">
                <i data-lucide="sun" id="themeIcon"></i>
            </button>
        </div>
    </div>
    <div class="navbar-collapsed" id="navbarCollapsed">
        <div class="nav-search">
            <i data-lucide="search"></i>
            <input type="text" id="searchInputCollapsed" placeholder="Cari tools...">
        </div>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
    <div class="categories" id="categoryFilter">
        <span class="chip active" data-cat="all">Semua</span>
        <span class="chip" data-cat="utility">Utility</span>
        <span class="chip" data-cat="dev">Dev</span>
        <span class="chip" data-cat="text">Text</span>
    </div>

    <div class="tools-grid" id="toolsGrid"></div>

    <div class="tool-page" id="toolPage" style="display:none;">
        <div class="tool-page-header">
            <button class="btn-back" onclick="closeToolPage()">
                <i data-lucide="arrow-left"></i>
                Kembali
            </button>
            <h2 id="toolPageTitle">Tool</h2>
        </div>
        <div class="tool-page-body" id="toolPageBody"></div>
    </div>
</div>

<!-- FIXED FOOTER -->
<div class="footer-credit">Leoo Tools Pro · Dihidupkan oleh <span>Galang</span></div>

<script src="splash.js"></script>
<script src="loader.js"></script>
</body>
</html>
