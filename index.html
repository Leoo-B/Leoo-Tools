<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a14">
    <title>Leoo Tools Pro</title>
    <link rel="icon" type="image/jpeg" href="wmremove-transformed.jpeg">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<!-- SCROLL TOP -->
<button class="scroll-top" id="scrollTopBtn" title="Ke Atas">
    <i data-lucide="arrow-up"></i>
</button>

<!-- MODAL KONFIRMASI KELUAR -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-card">
        <div class="confirm-icon">
            <i data-lucide="alert-triangle"></i>
        </div>
        <h3 class="confirm-title">Proses Masih Berjalan</h3>
        <p class="confirm-desc">Ada proses yang sedang berjalan. Jika keluar sekarang, proses akan dibatalkan.</p>
        <div class="confirm-actions">
            <button class="confirm-btn confirm-btn--stay" id="confirmStay">Tetap di Sini</button>
            <button class="confirm-btn confirm-btn--leave" id="confirmLeave">Keluar &amp; Batalkan</button>
        </div>
    </div>
</div>

<!-- FIXED HEADER -->
<header class="navbar-wrapper" id="navbarWrapper">
    <div class="navbar" id="navbarFull">
        <div class="brand">Leoo Tools <small>Pro</small></div>
        <div class="nav-search">
            <i data-lucide="search"></i>
            <input type="text" id="searchInput" placeholder="Cari tools..." autocomplete="off">
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <button class="theme-toggle" id="themeToggle" title="Toggle tema">
                <i data-lucide="sun" id="themeIcon"></i>
            </button>
        </div>
    </div>
    <div class="navbar-collapsed" id="navbarCollapsed">
        <div class="nav-search">
            <i data-lucide="search"></i>
            <input type="text" id="searchInputCollapsed" placeholder="Cari tools..." autocomplete="off">
        </div>
    </div>
</header>

<!-- HERO SECTION -->
<section class="hero" aria-labelledby="hero-title">
    <div class="hero-content">
        <h1 id="hero-title">Leoo Tools Pro</h1>
        <p class="hero-tagline">Free, no-login web toolbox</p>
        <div class="hero-search">
            <i data-lucide="search"></i>
            <input type="text" id="heroSearchInput" placeholder="Cari tools..." autocomplete="off">
        </div>
    </div>
    <div class="hero-glow" aria-hidden="true"></div>
</section>

<!-- DASHBOARD / TOOL GRID -->
<main class="dashboard" id="dashboard">
    <div class="categories" id="categoryFilter" role="tablist" aria-label="Kategori tools">
        <span class="chip active" data-cat="all" role="tab" aria-selected="true">Semua</span>
        <span class="chip" data-cat="utility" role="tab" aria-selected="false">Utility</span>
        <span class="chip" data-cat="dev" role="tab" aria-selected="false">Dev</span>
        <span class="chip" data-cat="text" role="tab" aria-selected="false">Text</span>
    </div>

    <div class="tools-grid" id="toolsGrid" role="list"></div>

    <div class="tool-page" id="toolPage" style="display:none;" role="region" aria-label="Halaman tool">
        <div class="tool-page-header">
            <button class="btn-back" onclick="closeToolPage()">
                <i data-lucide="arrow-left"></i>
                Kembali
            </button>
            <h2 id="toolPageTitle">Tool</h2>
        </div>
        <div class="tool-page-body" id="toolPageBody"></div>
    </div>
</main>

<!-- FIXED FOOTER -->
<footer class="footer" role="contentinfo">
    <p>Leoo Tools Pro &middot; Free, no-login web toolbox &middot; Built with <span class="heart">&#9829;</span> by Galang</p>
    <nav class="footer-links" aria-label="Footer links">
        <a href="#" rel="noopener">GitHub</a>
        <span class="divider" aria-hidden="true">|</span>
        <a href="#" rel="noopener">Issues</a>
        <span class="divider" aria-hidden="true">|</span>
        <a href="#" rel="noopener">License</a>
    </nav>
</footer>

<script src="splash.js"></script>
<script src="loader.js"></script>

<!-- NAVBAR SCROLL & SCROLL TOP -->
<script>
(function () {
    var wrapper         = document.getElementById('navbarWrapper');
    var scrollBtn       = document.getElementById('scrollTopBtn');
    var mainSearch      = document.getElementById('searchInput');
    var collapsedSearch = document.getElementById('searchInputCollapsed');
    var heroSearch      = document.getElementById('heroSearchInput');
    var COLLAPSE_THRESHOLD = 60;

    // Sync search inputs
    function syncSearch(source) {
        var val = source.value;
        [mainSearch, collapsedSearch, heroSearch].forEach(function (inp) {
            if (inp && inp !== source) inp.value = val;
        });
    }

    [mainSearch, collapsedSearch, heroSearch].forEach(function (inp) {
        if (inp) inp.addEventListener('input', function () { syncSearch(this); });
    });

    window.addEventListener('scroll', function () {
        var y = window.scrollY;
        if (wrapper) {
            if (y > COLLAPSE_THRESHOLD) wrapper.classList.add('is-collapsed', 'scrolled');
            else {
                wrapper.classList.remove('is-collapsed');
                if (y === 0) wrapper.classList.remove('scrolled');
            }
        }
        if (scrollBtn) {
            if (y > 300) scrollBtn.classList.add('show');
            else scrollBtn.classList.remove('show');
        }
    }, { passive: true });

    if (scrollBtn) scrollBtn.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
})();
</script>

</body>
</html>
