<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0e1a">
    <title>⚡ Leoo Tools Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/pixelboostai@1.0.2/dist/pixelboostai.min.js"></script>
</head>
<body>

<!-- PARTIKEL (Canvas) -->
<canvas id="particles-canvas"></canvas>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<!-- SCROLL TOP -->
<button class="scroll-top" id="scrollTopBtn" title="Ke Atas">↑</button>

<!-- SPLASH SCREEN -->
<div class="splash-screen" id="splash">
    <div class="nx-grid"></div>
    <div class="nx-rings">
        <div class="nx-ring"></div><div class="nx-ring"></div><div class="nx-ring"></div><div class="nx-ring"></div><div class="nx-ring"></div>
    </div>
    <div class="nx-orb"></div>
    <div class="splash-title">All tools Leoo</div>
    <div class="splash-sub">By Galang</div>
    <div class="nx-bar-wrap"><div class="nx-bar-track"><div class="nx-bar-fill"></div></div></div>
    <div class="nx-status" id="nexusShellStatus">menyiapkan tools</div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
    <div class="navbar">
        <div class="brand">⚡ Leoo V 1.0 <small>V 1.0</small></div>
        <div class="nav-search" id="navSearch">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Cari tools...">
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
            <button class="theme-toggle" id="themeToggle" title="Toggle tema (Dark/Light)">🌙</button>
            <span style="font-size:1.2rem; opacity:0.4;">✨</span>
        </div>
    </div>

    <div class="stats-bar" id="statsBar">
        <span>📦 Total Tools: <strong id="totalTools">0</strong></span>
        <span>🏷️ Kategori: <strong id="activeCategory">Semua</strong></span>
        <span>🕒 Terakhir: <strong id="lastOpened">-</strong></span>
        <span>🚀 <strong id="usageCounter">0</strong> tools telah digunakan hari ini</span>
    </div>

    <div class="categories" id="categoryFilter">
        <span class="chip active" data-cat="all">⚡ Semua</span>
        <span class="chip" data-cat="utility">🛠 Utility</span>
        <span class="chip" data-cat="dev">💻 Dev</span>
        <span class="chip" data-cat="text">📝 Text</span>
    </div>

    <div class="tools-grid" id="toolsGrid"></div>

    <div class="tool-page" id="toolPage" style="display:none;">
        <div class="tool-page-header">
            <button class="btn-back" onclick="closeToolPage()">← Back Lobby</button>
            <h2 id="toolPageTitle">Tool</h2>
        </div>
        <div class="tool-page-body" id="toolPageBody"></div>
    </div>

    <div class="footer-credit">⚡ Leoo Tools Pro · Dihidupkan oleh <span>GeminiXD</span></div>
</div>

<!-- SCRIPT LOADER -->
<script src="splash.js"></script>
<script src="loader.js"></script>
</body>
</html>
